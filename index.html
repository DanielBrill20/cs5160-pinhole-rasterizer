<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pinhole Rasterizer</title>
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="info">
    <h1>Pinhole Rasterizer</h1>
    <p>Created by Daniel Brill</p>
    <p><strong>Controls</strong></p>
    <ul>
      <li>Arrow keys: move the camera</li>
      <li>1: wireframe view</li>
      <li>2: pixelated line view</li>
      <li>3: triangle view</li>
      <li>R: reset the camera</li>
    </ul>
  </div>

<script type="module" src="main.js"></script>
</body>
</html>
